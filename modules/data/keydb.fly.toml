app = "cascade-keydb"
primary_region = "iad"

[build]
  image = "eqalpha/keydb:latest"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[services]]
  internal_port = 6379
  protocol = "tcp"

  [[services.ports]]
    port = 6379

[env]
  KEYDB_THREADS = "4"
  KEYDB_SAVE = "60 1"  # Save every 60s if 1+ changes
