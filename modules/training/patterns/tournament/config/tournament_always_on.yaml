# CASCADE Always-On Center Pattern Tournament Configuration
# Generates 4 patterns optimized for always-on center frequency design

tournament:
  initial_trials: 8              # Number of parallel trials (different seeds)
  total_generations: 10000       # Reduced for faster generation (can increase for better optimization)
  checkpoint_dir: ./checkpoints/always_on  # Separate checkpoint dir

pattern:
  count: 4                       # 4 patterns as per CASCADE spec (pattern_id 0-3)
  length: 1024                   # Full master pattern length
  redundancy: 1                  # No redundancy - patterns are already redundant via frequency diversity
  target_normal_db: -35.0        # Better orthogonality target for 4 patterns
  target_flip_db: -33.0          # Flip orthogonality target
  target_erasure_db: -32.0       # Erasure orthogonality target

hardware:
  num_p_cores: 8                 # Number of P-cores
  rotate_cores: true             # Rotate for thermal management
  rotation_interval_minutes: 30  # Rotate every 30 minutes
  process_priority: high         # Process priority
  execution_mode: auto           # Execution mode

ui:
  type: rich                     # UI type: rich, simple, or none
  refresh_rate: 1.0              # Refresh every 1 second
  log_level: INFO                # UI log level

logging:
  file_level: DEBUG              # File log level (everything)
  ui_level: INFO                 # UI log level (important only)
  log_dir: ./logs/always_on      # Separate log directory
  save_stats: true               # Save statistics for analysis